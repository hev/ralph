# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: ralph

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: ralph
    main: ./cmd/ralph
    binary: ralph
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/hev/ralph/internal/config.Version={{.Version}}
      - -X github.com/hev/ralph/internal/config.Commit={{.Commit}}
      - -X github.com/hev/ralph/internal/config.Date={{.Date}}
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: default
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999

release:
  github:
    owner: hev
    name: ralph
  draft: false
  prerelease: auto
  mode: append
  header: |
    ## Ralph {{ .Version }}
  footer: |
    **Full Changelog**: https://github.com/hev/ralph/compare/{{ .PreviousTag }}...{{ .Tag }}
  name_template: "v{{.Version}}"
